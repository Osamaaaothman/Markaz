appId: com.markaz.desktop
productName: Markaz
directories:
  buildResources: resources
  output: release
files:
  - "out/**/*"
  - "!**/*.map"
asarUnpack:
  - resources/**
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
