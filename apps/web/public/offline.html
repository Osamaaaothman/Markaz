<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markaz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <style>
      html { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #f8f6f1; color: #1b1a17; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #12110f; color: #ece9e1; } }
      main { max-width: 26rem; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; opacity: 0.75; line-height: 1.6; }
      button { font: inherit; padding: 10px 24px; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
      [lang="ar"] { display: none; }
      html[lang="ar"] [lang="ar"] { display: block; }
      html[lang="ar"] [lang="en"] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div lang="en"><h1>You are offline</h1><p>Markaz needs a connection to load your data. Check your network and try again.</p></div>
      <div lang="ar"><h1>لا يوجد اتصال بالإنترنت</h1><p>يحتاج مركز إلى اتصال لتحميل بياناتك. تحقق من الشبكة وحاول مجددًا.</p></div>
      <button type="button" id="retry"><span lang="en">Try again</span><span lang="ar">إعادة المحاولة</span></button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
