<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- lang/dir are set for real once i18next + RTL wiring lands — docs/08-FRONTEND-I18N-RULES.md §4 -->
    <title>Markaz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1b1a17" />
    <style>
      /* boot splash: shown until React mounts and replaces the contents of #root */
      .mk-boot { position: fixed; inset: 0; display: grid; place-items: center; background: #1b1a17; }
      .mk-boot img { width: 72px; height: 72px; animation: mk-boot-pulse 1.4s ease-in-out infinite; }
      @keyframes mk-boot-pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .mk-boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="mk-boot" aria-hidden="true"><img src="/favicon.svg" width="72" height="72" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
