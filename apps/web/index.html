/* ---- the Markaz splash (from the brand package, splash/splash.html) ---- */
.mk-splash {
  --sp-bg: #f8f6f1;
  --sp-frame: #1c5a40;
  --sp-centre: #a8842a;
  --sp-word: #1b1a17;
  --sp-muted: #6b665b;
  --sp-shine: #ffffff;
  --sp-shine-o: 0.55;
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: var(--sp-bg);
}

@media (prefers-color-scheme: dark) {
  html:not([data-splash="light"]) .mk-splash {
    --sp-bg: #12110f;
    --sp-frame: #ece9e1;
    --sp-centre: #c9aa5c;
    --sp-word: #ece9e1;
    --sp-muted: #b4afa3;
    --sp-shine: #c9aa5c;
    --sp-shine-o: 0.6;
  }
}

html[data-splash="dark"] .mk-splash {
    --sp-bg: #12110f;
    --sp-frame: #ece9e1;
    --sp-centre: #c9aa5c;
    --sp-word: #ece9e1;
    --sp-muted: #b4afa3;
    --sp-shine: #c9aa5c;
    --sp-shine-o: 0.6;
  }

.mk-splash__mark {
  inline-size: 96px;
  block-size: 96px;
  overflow: visible;
}

.mk-splash__frame {
  fill: none;
  stroke: var(--sp-frame);
  stroke-width: 6;
}

.mk-splash__frame path {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: mks-draw 220ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
}

.mk-splash__frame path:nth-child(2) {
  animation-delay: 120ms;
}

.mk-splash__frame path:nth-child(3) {
  animation-delay: 240ms;
}

.mk-splash__frame path:nth-child(4) {
  animation-delay: 360ms;
}

.mk-splash__centre {
  fill: var(--sp-centre);
  transform-box: fill-box;
  transform-origin: center;
  animation: mks-pop 220ms cubic-bezier(0.2, 0, 0, 1) 580ms both;
}

.mk-splash__shine polygon {
  fill: var(--sp-shine);
  opacity: var(--sp-shine-o);
}

.mk-splash__shine {
  transform: translateX(-36px);
  animation: mks-sweep 480ms cubic-bezier(0.4, 0, 0.2, 1) 800ms both;
}

.mk-splash__word {
  fill: var(--sp-word);
  animation: mks-rise 220ms cubic-bezier(0.2, 0, 0, 1) 1280ms both;
}

.mk-splash__status {
  position: absolute;
  inset-block-end: 72px;
  margin: 0;
  color: var(--sp-muted);
  font-size: 14px;
  opacity: 0;
  transition: opacity 480ms cubic-bezier(0.2, 0, 0, 1);
}

/* the app is not ready yet: the brackets breathe in turn */
.mk-splash.waiting .mk-splash__frame path {
  stroke-dashoffset: 0;
  animation: mks-calm 1920ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.mk-splash.waiting .mk-splash__frame path:nth-child(2) {
  animation-delay: 480ms;
}

.mk-splash.waiting .mk-splash__frame path:nth-child(3) {
  animation-delay: 960ms;
}

.mk-splash.waiting .mk-splash__frame path:nth-child(4) {
  animation-delay: 1440ms;
}

.mk-splash.slow .mk-splash__status {
  opacity: 1;
}

.mk-splash.leaving {
  animation: mks-out 220ms cubic-bezier(0.4, 0, 1, 1) forwards;
  pointer-events: none;
}

@keyframes mks-draw {
  to {
    stroke-dashoffset: 0;
  }
}

@keyframes mks-pop {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
}

@keyframes mks-sweep {
  from {
    transform: translateX(-36px);
  }
  to {
    transform: translateX(60px);
  }
}

@keyframes mks-rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

@keyframes mks-calm {
  0% {
    opacity: 1;
  }
  35%,
  100% {
    opacity: 0.28;
  }
}

@keyframes mks-out {
  to {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mk-splash__frame path {
    stroke-dashoffset: 0;
  }

  .mk-splash__shine {
    display: none;
  }
}

.mk-splash__word--ar,
.mk-splash__word--en,
.mk-splash__ar,
.mk-splash__en {
  display: none;
}

html[lang="ar"] .mk-splash__word--ar,
html[lang="ar"] .mk-splash__ar,
html[lang="en"] .mk-splash__word--en,
html[lang="en"] .mk-splash__en {
  display: block;
}

html[lang="ar"] .mk-splash__ar,
html[lang="en"] .mk-splash__en {
  display: inline;
}
