name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp_app@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate isolated test database
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres

      # `npm ci` installs the playwright package but never downloads the actual
      # Chromium binary — apps/api/src/documents/generic-document.spec.ts needs a
      # real browser to render a PDF (docs/10-TESTING-RULES.md §1: no mocking the
      # thing under test). Chromium only (not the full --with-deps set of every
      # browser) since that's the only engine this repo uses.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Module boundary check
        run: npm run boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # docs/10-TESTING-RULES.md §2.6: "every key exists in both ar and en — CI
      # fails otherwise."
      - name: i18n locale key parity
        run: npm run i18n:parity

      # @nestjs/platform-express hard-pins a vulnerable multer (advisories
      # GHSA-wc9g-mqfw-jrwm and siblings) — forced to a patched version via the
      # root package.json "overrides" field rather than waiting on upstream.
      - name: Dependency audit
        run: npm audit --audit-level=high
