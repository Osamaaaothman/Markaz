name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp_app@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      ZATCA_REQUIRE_SDK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      # Official download linked by sandbox.zatca.gov.sa/downloadSDK (2026-11-15).
      # Pin the archive digest: a replaced release must be reviewed, never silently accepted.
      - name: Install and verify official ZATCA SDK 3.4.8 (required)
        shell: bash
        run: |
          export ZATCA_SDK_DIR="$RUNNER_TEMP/zatca/zatca-einvoicing-sdk-Java-238-R3.4.8"
          # SharePoint's public download redirect needs its anonymous session cookie.
          curl --fail --silent --show-error --location --retry 3 --max-time 180 --cookie-jar "$RUNNER_TEMP/zatca-sdk.cookies" --cookie "$RUNNER_TEMP/zatca-sdk.cookies" 'https://sadzit.sharepoint.com/:u:/s/EXTERNALZATCA/IQCVzjXNpLTOTZbrYhs_w7aIAb7pPg1wfwl6wACeu1xCPAQ?e=pn3riq&download=1' --output "$RUNNER_TEMP/zatca-sdk.zip"
          echo "91d079b4a6c21c8ed7fb6ec434227409537119cae8b74de34dc150f91793d1f6  $RUNNER_TEMP/zatca-sdk.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/zatca-sdk.zip" -d "$RUNNER_TEMP/zatca"
          node scripts/prepare-zatca-sdk.mjs
          echo "ZATCA_SDK_DIR=$ZATCA_SDK_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Migrate isolated test database
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres

      # `npm ci` installs the playwright package but never downloads the actual
      # Chromium binary — apps/api/src/documents/generic-document.spec.ts needs a
      # real browser to render a PDF (docs/10-TESTING-RULES.md §1: no mocking the
      # thing under test). Chromium only (not the full --with-deps set of every
      # browser) since that's the only engine this repo uses.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Module boundary check
        run: npm run boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Interface style browser regression
        run: |
          npx vite build --config apps/web/vite.redesign.config.ts
          node scripts/check-interface-styles.mjs
          node scripts/check-document-interface.mjs
          node scripts/check-compliance-feedback.mjs
          node scripts/check-invoice-preflight.mjs
          node scripts/check-editable-quantities.mjs

      - name: Interface review screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-theme-review
          path: |
            output/interface-theme-qa/
            output/feedback-trail-fix/
          if-no-files-found: ignore

      - name: Test
        run: npm run test

      - name: Cost center API validation and permissions
        run: npm run test:cost-centers --workspace=@erp/api

      # docs/10-TESTING-RULES.md §2.6: "every key exists in both ar and en — CI
      # fails otherwise."
      - name: i18n locale key parity
        run: npm run i18n:parity

      # @nestjs/platform-express hard-pins a vulnerable multer (advisories
      # GHSA-wc9g-mqfw-jrwm and siblings) — forced to a patched version via the
      # root package.json "overrides" field rather than waiting on upstream.
      - name: Dependency audit
        run: npm audit --audit-level=high
