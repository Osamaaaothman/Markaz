name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Module boundary check
        run: npm run boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=high

      # i18n locale-key-parity check joins this pipeline in M3, once i18next exists
      # (docs/10-TESTING-RULES.md §2.6) — nothing to check yet in M0.
