server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — the router (added M9) handles unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the API is added once real endpoints exist (M1+).
    # location /api/ {
    #     proxy_pass http://api:3000/;
    # }
}
