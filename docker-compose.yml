# The actual deployment unit shipped to every customer (docs/12-OPS-AND-DEPLOYMENT.md).
# `docker compose up -d` must produce a working, seeded system with no manual steps
# beyond this file and the documented install runbook (M1) — that is the M0 gate.
#
# All credentials below come from a real `.env` file (git-ignored, copy from
# .env.example) via Compose's automatic .env substitution — never hard-coded here.
# docs/09-SECURITY-RULES.md §1: "No secrets in source... Only .env.example with
# placeholders is committed."
#
# Migrations are an explicit step (`npm run migrate:deploy --workspace=@erp/db`),
# never run automatically on API startup — docs/12-OPS-AND-DEPLOYMENT.md §2.

name: erp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # This is the MIGRATION-OWNER role only — it owns the schema and is used solely
      # to run `prisma migrate deploy`. The running api/worker containers connect as
      # the separate, restricted `erp_app` role instead (created by the first
      # migration), which has no UPDATE/DELETE grant on audit_log — docs/04-DATA-MODEL-RULES.md
      # §9 and CLAUDE.md §1 invariant #8 ("audit log is append-only, no exceptions").
      # A single shared role cannot enforce this: a table owner always retains full
      # DML rights regardless of REVOKE, so the roles must be genuinely separate.
      POSTGRES_USER: ${MIGRATE_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${MIGRATE_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DB_NAME:?set in .env}
    ports:
      # Host-exposed for local Prisma CLI / DB tooling convenience. Removing this for
      # production hardening is an M10 item, same bucket as digest pinning.
      - "5432:5432"
    volumes:
      # This volume holds this deployment's ENTIRE customer database — the one thing
      # that must be backed up. docs/12-OPS-AND-DEPLOYMENT.md §6.
      - erp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIGRATE_DB_USER:?set in .env} -d ${DB_NAME:?set in .env}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # Restricted runtime role — NOT the migration owner. See the db service comment.
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      ACTIVATION_SERVICE_URL: ${ACTIVATION_SERVICE_URL:-}
      LICENSE_MASTER_KEY: ${LICENSE_MASTER_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host port is overridable — a dev machine running several projects at once
      # may already have something else on 3000. The container's own port stays
      # 3000 regardless (healthcheck below runs inside the container).
      - "${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: redis://redis:6379
      ACTIVATION_SERVICE_URL: ${ACTIVATION_SERVICE_URL:-}
      LICENSE_MASTER_KEY: ${LICENSE_MASTER_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # docs/02-ARCHITECTURE-RULES.md §6: the worker is a separate process from the API,
    # even in Compose — same image, different entrypoint, own container.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  erp_db_data:
