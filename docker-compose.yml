# The actual deployment unit shipped to every customer (docs/12-OPS-AND-DEPLOYMENT.md).
# `docker compose up -d` must produce a working, seeded system with no manual steps
# beyond this file and the documented install runbook (M1) — that is the M0 gate.
#
# Migrations are an explicit step (`pnpm --filter @erp/db migrate:deploy`), never run
# automatically on API startup — docs/12-OPS-AND-DEPLOYMENT.md §2.

name: erp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    volumes:
      # This volume holds this deployment's ENTIRE customer database — the one thing
      # that must be backed up. docs/12-OPS-AND-DEPLOYMENT.md §6.
      - erp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # docs/02-ARCHITECTURE-RULES.md §6: the worker is a separate process from the API,
    # even in Compose — same image, different entrypoint, own container.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  erp_db_data:
